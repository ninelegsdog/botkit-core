name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy botkit_core/
      - name: Test
        run: pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Notify
        run: echo "botkit-core $(echo "${{ github.ref_name }}" | sed 's/^v//') verified and buildable"
