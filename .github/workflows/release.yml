name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy botkit_core/
      - name: Test
        run: pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Notify
        run: echo "botkit-core $(echo "${{ github.ref_name }}" | sed 's/^v//') verified and buildable"
