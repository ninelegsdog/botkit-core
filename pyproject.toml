[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit-core"
version = "0.6.0"
description = "Shared core library for the 9 BotKit Telegram bots"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "aiogram>=3.30",
    "aiosqlite>=0.19",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "aiohttp>=3.9",
    "python-json-logger>=2.0",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0",
]

[tool.setuptools.packages.find]
include = ["botkit_core*"]

[tool.setuptools.package-data]
botkit_core = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=botkit_core --cov-branch --cov-report=term-missing --cov-fail-under=70"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
